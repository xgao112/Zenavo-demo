<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>运行状态 · Zenavo 部署测试</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <h1>运行状态</h1>
    <p>数据来自服务器的 /health 接口，每 5 秒刷新一次。</p>
    <dl>
      <dt>状态</dt><dd><span class="dot" id="dot"></span><span id="status">读取中…</span></dd>
      <dt>版本</dt><dd id="version">—</dd>
      <dt>已运行</dt><dd id="uptime">—</dd>
      <dt>服务器时间</dt><dd id="time">—</dd>
    </dl>
    <a class="back" href="/">返回首页</a>
  </main>
  <script>
    function fmt(s) {
      const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
      return (h ? h + " 小时 " : "") + (m ? m + " 分 " : "") + sec + " 秒";
    }
    async function load() {
      try {
        const r = await fetch("/health", { cache: "no-store" });
        const d = await r.json();
        document.getElementById("status").textContent = "正常运行";
        document.getElementById("dot").className = "dot ok";
        document.getElementById("version").textContent = "v" + d.version;
        document.getElementById("uptime").textContent = fmt(d.uptimeSeconds);
        document.getElementById("time").textContent = new Date(d.time).toLocaleString("zh-CN");
      } catch (e) {
        document.getElementById("status").textContent = "无法连接服务器，请检查服务是否在运行";
        document.getElementById("dot").className = "dot";
      }
    }
    load();
    setInterval(load, 5000);
  </script>
</body>
</html>
